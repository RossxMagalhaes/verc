<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gerar convites · Cláudio & Eunice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e9;--ink:#1e1b18;--muted:#6f665c;--gold:#646d43}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fffdf8;max-width:480px;width:100%;padding:40px 28px;border-radius:6px;box-shadow:0 30px 60px -30px rgba(30,27,24,.35)}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:38px;line-height:1.1}
h1 em{color:var(--gold)}
p.sub{color:var(--muted);font-size:14px;margin:10px 0 28px;line-height:1.6}
label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--gold)}
input{width:100%;margin:10px 0 18px;padding:15px 16px;font-size:16px;border:1px solid rgba(30,27,24,.2);border-radius:6px;font-family:inherit;background:#fff}
input:focus{outline:2px solid var(--gold);border-color:transparent}
.link{font-size:13px;word-break:break-all;background:#f3ede3;padding:12px 14px;border-radius:6px;color:var(--muted);min-height:44px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button,a.btn{flex:1;min-width:140px;padding:14px 16px;border-radius:40px;border:1px solid var(--ink);background:transparent;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink)}
.wa{background:#1f7a4d;border-color:#1f7a4d;color:#fff!important}
.ok{font-size:12px;color:#1f7a4d;margin-top:10px;height:16px}
</style>
</head>
<body>
<div class="card">
  <h1>Convites <em>personalizados</em></h1>
  <p class="sub">Escreve o nome de quem vai receber (ex.: “Família Mabunda” ou “Tia Rosa &amp; Tio Paulo”). O convite abre com esse nome em destaque.</p>
  <label for="n">Nome do convidado</label>
  <input id="n" placeholder="Família Mabunda" autocomplete="off">
  <div class="link" id="l">—</div>
  <div class="row">
    <button id="copy">Copiar link</button>
    <a class="btn wa" id="wa" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
  </div>
  <p class="ok" id="ok"></p>
</div>
<script>
const n=document.getElementById('n'),l=document.getElementById('l'),wa=document.getElementById('wa');
function url(){const v=n.value.trim();return location.origin+'/'+(v?'?para='+encodeURIComponent(v):'');}
function upd(){
  const u=url(),v=n.value.trim();l.textContent=u;
  const msg=`Olá${v?' '+v:''}! 💛\nO Cláudio e a Eunice prepararam algo especial para vocês.\nAbram com som 🎶\n${u}`;
  wa.href='https://wa.me/?text='+encodeURIComponent(msg);
}
n.addEventListener('input',upd);upd();
document.getElementById('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(url());}catch(e){const t=document.createElement('textarea');t.value=url();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  const ok=document.getElementById('ok');ok.textContent='Link copiado ✓';setTimeout(()=>ok.textContent='',2000);
};
</script>
</body>
</html>
